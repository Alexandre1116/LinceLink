name: Build mods
on: [push, pull_request, workflow_dispatch]
jobs:
  neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p neoforge-1.21.1 build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: neoforge-1.21.1
          path: neoforge-1.21.1/build/libs/*.jar
  modern:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [fabric, forge-1.16.5, forge-1.18.2, forge-1.20.1, forge-1.21.1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          if [ '${{ matrix.project }}' = fabric ]; then
            ./gradlew build --no-daemon
          else
            ./gradlew -p '${{ matrix.project }}' build --no-daemon
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}
          path: '**/build/libs/*.jar'
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - run: cd forge-1.12.2 && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: forge-1.12.2
          path: forge-1.12.2/build/libs/*.jar
