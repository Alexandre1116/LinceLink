name: Publish release to CurseForge

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: ${{ matrix.loader }} ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {loader: forge, minecraft: '1.12.2', java: '8'}
          - {loader: forge, minecraft: '1.16.5', java: '8'}
          - {loader: forge, minecraft: '1.18.2', java: '17'}
          - {loader: forge, minecraft: '1.20.1', java: '17'}
          - {loader: forge, minecraft: '1.21.1', java: '21'}
          - {loader: fabric, minecraft: '1.16.5', java: '8', dependency: '306612(required)'}
          - {loader: fabric, minecraft: '1.18.2', java: '17', dependency: '306612(required)'}
          - {loader: fabric, minecraft: '1.20.1', java: '17', dependency: '306612(required)'}
          - {loader: fabric, minecraft: '1.21.1', java: '21', dependency: '306612(required)'}
    steps:
      - name: Download the matching release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          LOADER: ${{ matrix.loader }}
          MINECRAFT: ${{ matrix.minecraft }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.-]+)?$ ]] || { echo 'Expected a version tag such as v0.1.8'; exit 1; }
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern "lincelink-${LOADER}-${MINECRAFT}-${version}.jar" --dir dist
      - name: Send to CurseForge
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3
        with:
          curseforge-id: '1801410'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/*.jar
          name: LinceLink ${{ github.event.release.tag_name }} - ${{ matrix.loader }} ${{ matrix.minecraft }}
          version-type: ${{ github.event.release.prerelease && 'alpha' || 'release' }}
          changelog: ${{ github.event.release.body || 'LinceLink release.' }}
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.minecraft }}
          java: ${{ matrix.java }}
          environment: client
          curseforge-dependencies: ${{ matrix.dependency || '' }}
