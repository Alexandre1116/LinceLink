plugins { id 'fabric-loom' }
version = '0.1.6'
group = 'pt.tailcatmod'
base { archivesName = 'lincelink-fabric-1.18.2' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.18.2'
 mappings 'net.fabricmc:yarn:1.18.2+build.4:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.10'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.77.0+1.18.2'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
sourceSets.main.java.srcDir '../common/src/main/java'

tasks.withType(JavaCompile).configureEach { options.release = 17 }

processResources {
    from('../branding') { include 'lincelink.png' }
    from('../branding') { include 'lincelink.png'; into 'assets/tailcatmod/textures/gui' }
}
