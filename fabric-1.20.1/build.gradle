plugins { id 'fabric-loom' }
version = '0.1.7'
group = 'pt.tailcatmod'
base { archivesName = 'lincelink-fabric-1.20.1' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.20.1'
 mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.10'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.6+1.20.1'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
sourceSets.main.java.srcDir '../common/src/main/java'

tasks.withType(JavaCompile).configureEach { options.release = 17 }

processResources {
    from('../branding') { include 'lincelink.png' }
    from('../branding') { include 'lincelink.png'; into 'assets/tailcatmod/textures/gui' }
}

processResources { from('../LICENSE') { rename { 'LICENSE-LinceLink.txt' } } }
