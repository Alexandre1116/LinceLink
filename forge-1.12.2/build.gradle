buildscript {
 repositories { maven { url = 'https://maven.minecraftforge.net/' }; mavenCentral() }
 dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197' }
}
apply plugin: 'net.minecraftforge.gradle'
version = '0.1.6'
group = 'pt.tailcatmod'
archivesBaseName = 'lincelink-forge-1.12.2'
sourceCompatibility = targetCompatibility = '1.8'
minecraft { mappings channel: 'snapshot', version: '20171003-1.12' }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2864' }
sourceSets.main.java.srcDir '../common/src/main/java'
jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }

processResources {
    from('../branding') { include 'lincelink.png' }
    from('../branding') { include 'lincelink.png'; into 'assets/tailcatmod/textures/gui' }
}
