plugins { id 'net.minecraftforge.gradle' version '6.0.54' }
version = '0.1.0'
group = 'pt.tailcatmod'
base { archivesName = 'tailcat-forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
minecraft { mappings channel: 'official', version: '1.20.1'; reobf = true }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.28' }
sourceSets.main.java.srcDir '../common/src/main/java'

tasks.withType(JavaCompile).configureEach { options.release = 17 }

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
