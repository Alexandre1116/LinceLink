plugins { id 'net.minecraftforge.gradle' version '6.0.54' }
version = '0.1.7'
group = 'pt.tailcatmod'
base { archivesName = 'lincelink-forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
minecraft { mappings channel: 'official', version: '1.20.1'; reobf = true }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.28' }
sourceSets.main.java.srcDir '../common/src/main/java'

tasks.withType(JavaCompile).configureEach { options.release = 17 }

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }

dependencies { testImplementation 'junit:junit:4.13.2' }

processResources {
    from('../branding') { include 'lincelink.png' }
    from('../branding') { include 'lincelink.png'; into 'assets/tailcatmod/textures/gui' }
}

processResources { from('../LICENSE') { rename { 'LICENSE-LinceLink.txt' } } }
