plugins { id 'net.minecraftforge.gradle' version '6.0.54' }
version = '0.1.0'
group = 'pt.tailcatmod'
base { archivesName = 'tailcat-forge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
minecraft { mappings channel: 'official', version: '1.21.1'; reobf = false }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.21.1-52.1.20' }
sourceSets.main.java.srcDir '../common/src/main/java'

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
